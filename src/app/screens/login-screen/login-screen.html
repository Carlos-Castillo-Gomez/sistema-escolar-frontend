<section class="login-new">
  <div class="login-container">
    <!-- Section Left: Form -->
     <div class="login-form-section">
      <div class="login-brand">
        <img src="/assets/images/escudoB.png" alt="Logo BUAP" class="logo-buap">
        <span class="brand-title">Sistema Escolar</span>
      </div>
      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa los datos que registraste</p>
      <!-- Aqui vamos a colocar el formulario de inicio de sesión -->
      <form (ngSubmit)="login()" class="login-form" #form="ngForm">
        <!-- Se agregan los inputs para el correo y la contraseña, con validaciones de Angular -->
        <!-- Campo para el correo electronico -->
        <div class="form-group"> <!-- Esto ya que lleva etiqueta -->
          <label for="email">Correo electronico</label>
          <input type="email" [(ngModel)]="username" name="username" class="form-control" id="email" placeholder="nombre@correo.com" autocomplete="username">
          @if (errors.username) { <!-- Un IF funciona para mostrar o no elementos, siempre devuelve un booleano -->
            <div class="invalid-feedback">{{ errors.username }}</div>
          }
        </div>
        <!-- Campo para la contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div style="position: relative;">
            <input [type]="typeInput" [(ngModel)]="password" id="password" name="password_user" class="form-control pwd"
              placeholder="Minimo 8 caracteres" autocomplete="current-password" {keyup.enter}="login()" style="padding-right: 40px;">
            <span class="show-password" (click)="showPassword()"
              style="position: absolute; right:18px; top:50%; transform: translateY(-50%);">
              <i [ngClass]="typeInput == 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill'"></i>
            </span>
          </div>
          @if (errors.password) {
            <div class="invalid-feedback">{{ errors.password }}</div>
          }
        </div>
        <!-- Se agrega el label de olvide mi contraseña -->
         <div class="form-links">
          <a (click)="olvidecontraseña()">¿Olvidaste tu contraseña?</a>
         </div>
        <!-- Se agrega el boton de iniciar sesion -->
        <button class="btn-login" type="submit" {disable}="load">Iniciar Sesión</button>
      </form>
     </div>


    <!-- Section Right: Image -->
    <div class="login-ilustration-section">
      <div class="welcome-message">
        <h2>Bienvenido al Sistema Escolar</h2>
        <p>Gestiona tus actividades acadèmicas de manera eficiente y sencilla.</p>
      </div>
  </div>


</section>
